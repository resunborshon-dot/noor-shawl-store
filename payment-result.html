<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOOR — Payment status</title><style>body{margin:0;background:#f8f2e9;color:#4b0718;font-family:Georgia,serif;display:grid;min-height:100vh;place-items:center}.card{background:white;padding:38px 28px;max-width:460px;margin:20px;text-align:center;border:1px solid #d6b47c}.brand{font-size:30px;letter-spacing:7px;color:#4b0718}.muted{font:14px Arial,sans-serif;line-height:1.7;color:#756354}a{display:inline-block;background:#4b0718;color:white;text-decoration:none;padding:13px 22px;font:12px Arial,sans-serif;letter-spacing:1px}</style><main class="card"><div class="brand">NOOR</div><h1 id="heading">Checking your payment</h1><p class="muted" id="message">Please wait while we confirm your bKash transaction.</p><a href="/">RETURN TO STORE</a></main><script>const q=new URLSearchParams(location.search),r=q.get('result');const h=document.getElementById('heading'),m=document.getElementById('message');if(r==='success'){h.textContent='Payment successful';m.textContent='Your order '+(q.get('order')||'')+' is confirmed. Thank you for shopping with NOOR.'}else if(r==='cancelled'){h.textContent='Payment cancelled';m.textContent='Your payment was cancelled. Your order has not been marked as paid.'}else if(r==='pending'){h.textContent='Payment under verification';m.textContent='We could not confirm the payment automatically. Please contact NOOR with your order details. Do not pay again until we check.'}else{h.textContent='Payment not completed';m.textContent='Your order is not marked as paid. Please return to the store or contact NOOR.'}</script></html>
