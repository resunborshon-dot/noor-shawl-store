<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOOR — Admin</title>
<style>
body{margin:0;background:#faf7f2;color:#40362e;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:40px auto;padding:20px}h1,h2{font-family:Georgia,serif;font-weight:400}input,select{padding:12px;border:1px solid #d8cabb;margin:5px 0;width:100%;max-width:380px}button{padding:10px 15px;background:#40362e;color:white;border:0;cursor:pointer;margin:4px}button:disabled{opacity:.5}.card{background:white;padding:20px;margin:15px 0;border:1px solid #e6ddd3}.muted{color:#877b70;font-size:13px}.order{border-top:1px solid #eee;padding:16px 0;display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.status{font-weight:bold}.error{color:#a22}.hidden{display:none}@media(max-width:650px){.order{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><h1>NOOR — Store Admin</h1><p class="muted">Private order management. Do not share this page or your admin password.</p>
<section class="card" id="login"><h2>Admin login</h2><form id="loginForm"><input type="password" id="password" placeholder="Admin password" required><br><button>Log in</button></form><p id="loginMsg" class="error"></p></section>
<section id="dashboard" class="hidden"><div class="card"><button id="refresh">Refresh orders</button><button id="logout">Log out</button><p id="summary" class="muted"></p></div><div class="card"><h2>Orders</h2><div id="orders">Loading…</div></div></section>
</main><script>
let token=sessionStorage.getItem("noor_admin_token")||"";
const $=id=>document.getElementById(id);
async function api(path,options={}){const r=await fetch("/.netlify/functions/"+path,{...options,headers:{"Content-Type":"application/json","Authorization":"Bearer "+token,...(options.headers||{})}});const d=await r.json();if(!r.ok)throw new Error(d.error||"Request failed");return d;}
function show(){ $("login").classList.toggle("hidden",!!token);$("dashboard").classList.toggle("hidden",!token);if(token)load();}
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginMsg").textContent="";try{const d=await api("admin-auth",{method:"POST",headers:{},body:JSON.stringify({password:$("password").value})});token=d.token;sessionStorage.setItem("noor_admin_token",token);$("password").value="";show();}catch(err){$("loginMsg").textContent=err.message;}};
$("refresh").onclick=load;$("logout").onclick=()=>{token="";sessionStorage.removeItem("noor_admin_token");show();};
async function load(){try{const d=await api("admin-orders");$("summary").textContent=`${d.orders.length} orders in the database`;$("orders").innerHTML=d.orders.map(o=>`<article class="order"><div><b>${esc(o.order_number)}</b> · ${esc(o.customer_name)}<p class="muted">${esc(o.phone)} · ${esc(o.city)}<br>${esc(o.address)}<br>${esc(o.email||"No email")}<br>${(o.items||[]).map(i=>esc(i.name)+" × "+i.quantity).join(", ")}</p><p>Payment: ${esc(o.payment_method)} · ${esc(o.payment_status||"Pending")} · TrxID: ${esc(o.transaction_id||"—")}</p><p class="muted">Subtotal ৳${Number(o.subtotal||o.total).toLocaleString("en-BD")} + delivery ৳${Number(o.delivery_charge||0).toLocaleString("en-BD")}</p><b>৳${Number(o.total).toLocaleString("en-BD")}</b></div><div><span class="status">${esc(o.status)}</span><p class="muted">Created: ${new Date(o.created_at).toLocaleString()}</p></div><div><select data-status="${esc(o.id)}"><option ${o.status==="New"?"selected":""}>New</option><option ${o.status==="Confirmed"?"selected":""}>Confirmed</option><option ${o.status==="Processing"?"selected":""}>Processing</option><option ${o.status==="Shipped"?"selected":""}>Shipped</option><option ${o.status==="Delivered"?"selected":""}>Delivered</option><option ${o.status==="Cancelled"?"selected":""}>Cancelled</option><option ${o.status==="Payment review"?"selected":""}>Payment review</option><option ${o.status==="Awaiting bKash payment"?"selected":""}>Awaiting bKash payment</option></select><button data-update="${esc(o.id)}">Update</button></div></article>`).join("")||"No orders yet.";}catch(e){$("orders").textContent=e.message;if(e.message.toLowerCase().includes("unauthorized")){token="";sessionStorage.removeItem("noor_admin_token");show();}}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
$("orders").addEventListener("click",async e=>{const id=e.target.dataset.update;if(!id)return;const status=document.querySelector(`[data-status="${CSS.escape(id)}"]`).value;e.target.disabled=true;try{await api("update-order",{method:"POST",body:JSON.stringify({id,status})});await load();}catch(err){alert(err.message)}finally{e.target.disabled=false;}});
show();
</script></body></html>
